<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:;">
    <title data-i18n="manual.title">NoteConnection User Manual</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1a;
        color: #eeeeee;
        padding: 20px;
        max-width: 900px;
        margin: 0 auto;
        line-height: 1.6;
      }
      a {
        color: #61dafb;
      }
      pre {
        background: #2d2d2d;
        padding: 15px;
        border-radius: 5px;
        overflow-x: auto;
      }
      code {
        font-family: "Consolas", "Monaco", monospace;
        background: #333;
        padding: 2px 4px;
        border-radius: 3px;
      }
      pre code {
        background: none;
        padding: 0;
      }
      h1,
      h2,
      h3 {
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 20px;
      }
      th, td {
        border: 1px solid #444;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #333;
      }
      blockquote {
        border-left: 4px solid #61dafb;
        margin: 0;
        padding-left: 15px;
        color: #aaa;
      }
      img {
        max-width: 100%;
        border-radius: 5px;
      }
      .back-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #2c5282;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        text-decoration: none;
        z-index: 100;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      }
      .back-btn:hover {
        background: #3182ce;
      }
    </style>
    <!-- Load offline marked.js library -->
    <script src="libs/marked.min.js"></script>
  </head>
  <body>
    <button class="back-btn" onclick="window.close()" data-i18n="manual.close">Close</button>
    <div id="content" data-i18n="manual.loading">Loading documentation...</div>

    <script>
      // Detect user language (check localStorage or default to 'en')
      let userLang = 'en';
      try {
        userLang = localStorage.getItem('user_language') || 'en';
      } catch (e) {
        console.warn('Could not access localStorage:', e);
      }

      // Select manual file based on language
      const manualFile = userLang === 'zh' ? 'User_Manual_zh.md' : 'User_Manual.md';

      fetch(manualFile)
        .then((response) => {
          if (response.ok) return response.text();
          // Fallback to README if User_Manual not found
          console.warn(`${manualFile} not found, trying README.md`);
          return fetch("README.md").then(res => {
              if(!res.ok) throw new Error("Documentation files not found.");
              return res.text();
          });
        })
        .then((text) => {
          // Use marked to parse markdown
          if (typeof marked !== 'undefined' && marked.marked) {
            document.getElementById("content").innerHTML = marked.marked(text);
          } else if (typeof marked !== 'undefined' && marked.parse) {
            document.getElementById("content").innerHTML = marked.parse(text);
          } else {
            // If marked isn't loaded, just display as plain text
            document.getElementById("content").textContent = text;
          }
        })
        .catch((err) => {
          const errorTitle = userLang === 'zh' ? '加载文档时出错' : 'Error Loading Documentation';
          const errorMsg = userLang === 'zh' ? '无法加载 User_Manual.md 或 README.md。' : 'Could not load User_Manual.md or README.md.';
          const techDetail = userLang === 'zh' ? '技术细节' : 'Technical details';
          
          document.getElementById("content").innerHTML = `
                    <h2 style="color: #ff6b6b">${errorTitle}</h2>
                    <p>${errorMsg}</p>
                    <p>${techDetail}: ${err.message}</p>
                `;
        });
    </script>
  </body>
</html>
