<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree-Path Layout Mockup v2</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #eee; margin: 0; padding: 20px; }
        svg { border: 1px solid #444; background: #252526; width: 100%; height: 800px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .node rect { cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .node rect:hover { stroke: #ffd700; stroke-width: 3px; }
        .node text { font-size: 12px; fill: #eee; text-shadow: 0 1px 4px #000; pointer-events: none; font-weight: 600; }
        .link { stroke: #555; stroke-width: 2px; opacity: 0.6; fill: none; transition: d 0.5s; pointer-events: none; }
        .spine-link { stroke: #4caf50; stroke-width: 5px; opacity: 1; filter: drop-shadow(0 0 2px rgba(76,175,80,0.5)); }
        .tributary-link { stroke: #2196f3; }
        .hull { pointer-events: none; } /* Fix Interaction Blocking */
        .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        button { padding: 8px 16px; background: #333; color: white; border: 1px solid #555; cursor: pointer; border-radius: 4px; }
        button:hover { background: #444; border-color: #888; }
        button.primary { background: #007acc; border-color: #007acc; }
        button.primary:hover { background: #006bbed1; }
        .legend { font-size: 14px; margin-left: 20px; color: #aaa; display: flex; gap: 15px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; }
    </style>
</head>
<body>

    <div class="controls">
        <h3>Tree-Path v2</h3>
        <button class="primary" onclick="resetGraph()">Reset View</button>
        <button onclick="expandAll()">Expand All</button>
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: #4caf50;"></div> Main Path (Spine)</div>
            <div class="legend-item"><div class="dot" style="background: #2196f3;"></div> Tributaries (Tree)</div>
        </div>
    </div>

    <svg id="viz"></svg>

    <script>
        // --- 1. Data Structure (Deep Hierarchy) ---
        const width = window.innerWidth - 60;
        const height = 800;
        const svg = d3.select("#viz");
        svg.selectAll("*").remove(); 
        
        // Layers for Z-Index Management (Hulls at bottom)
        const g = svg.append("g").attr("transform", `translate(100, ${height / 2})`);
        const layerHulls = g.append("g").attr("class", "layer-hulls");
        const layerLinks = g.append("g").attr("class", "layer-links");
        const layerNodes = g.append("g").attr("class", "layer-nodes");

        svg.call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)));

        // Data: "Machine Learning" path with Collision Scenario
        const rawEdges = [
            // Main Path (Stationary Spine)
            { s: "Math", t: "Calculus" }, 
            { s: "Calculus", t: "Optimization" }, 
            { s: "Optimization", t: "ML Basics" }, 
            { s: "ML Basics", t: "Deep Learning" },
            
            // Scenario: Optimization (Even/Down) has wide tree
            { s: "Derivatives", t: "Optimization" }, // 1
            { s: "Convexity", t: "Optimization" }, // 2
            { s: "Gradient", t: "Optimization" }, // 3
            { s: "Hessian", t: "Optimization" }, // 4
            { s: "Chain Rule", t: "Derivatives" }, // 1.1
            { s: "Limits", t: "Derivatives" }, // 1.2
            // Collision Candidates
            { s: "Partial Diff", t: "Gradient" },
            { s: "Directional", t: "Gradient" },
            
            // Scenario: ML Basics (Odd/Up) - Small
            { s: "Statistics", t: "ML Basics" },

            // Scenario: Deep Learning (Even/Down) - Collision with Optimization's tail
            { s: "Neural Nets", t: "Deep Learning" },
            { s: "Backprop", t: "Deep Learning" }, 
            { s: "Data", t: "Deep Learning" },
            // Deep tree for Neural Nets expanding LEFT towards Optimization
            { s: "Weights", t: "Neural Nets" }, 
            { s: "Biases", t: "Neural Nets" },
            { s: "Activation", t: "Neural Nets" },
            { s: "Dropout", t: "Neural Nets" },
            { s: "Normalization", t: "Neural Nets" }
        ];

        let nodes = Array.from(new Set(rawEdges.flatMap(e => [e.s, e.t])))
            .map(id => ({ id, expanded: true, x: 0, y: 0, placed: false }));
            
        const mainPathIds = ["Math", "Calculus", "Optimization", "ML Basics", "Deep Learning"];

        // Config - Visual & Logical Sync
        const VISUAL_WIDTH = 140;
        const VISUAL_HEIGHT = 40;
        const H_GAP = 50; // Horizontal gap between siblings
        const V_GAP = 120; // Vertical gap (levels)
        
        const SIBLING_STRIDE = VISUAL_WIDTH + H_GAP; // Minimum center-to-center distance
        const NODE_HALF_W = VISUAL_WIDTH / 2;
        const SPINE_PADDNG = 100;
        const MIN_SPINE_INTERVAL = VISUAL_WIDTH + 150;

        function updateLayout() {
            // Reset
            nodes.forEach(n => { n.placed = false; n._contour = null; });

            // 1. Identify Spines
            const spineMap = new Map();
            mainPathIds.forEach((id, index) => {
                const node = nodes.find(n => n.id === id);
                node.isSpine = true;
                node.spineIndex = index;
                node.placed = true;
                node.y = 0;
                spineMap.set(index, node);
            });

            // 2. Global Accumulator Contours
            const globalContours = {
                1: {},   // Down
                [-1]: {} // Up
            };

            let lastSpineX = 0;

            mainPathIds.forEach((id, index) => {
                const node = nodes.find(n => n.id === id);
                const dir = (index % 2 === 0) ? 1 : -1;
                
                // 2.1 Calculate Local Contour
                const contour = calculateContour(node, dir);
                node._contour = contour;

                // 2.2 Determine X placement
                let minSafeX = (index === 0) ? 0 : (lastSpineX + MIN_SPINE_INTERVAL);
                
                // Collision Check
                for (const [lvlStr, minVal] of Object.entries(contour.left)) {
                    const lvl = parseInt(lvlStr);
                    const relevantSide = (lvl > 0) ? 1 : (lvl < 0) ? -1 : 0;
                    if (relevantSide === 0) continue; 
                    if (relevantSide !== dir) continue; 
                    
                    const globalMax = globalContours[relevantSide][lvl];
                    if (globalMax !== undefined) {
                        const requiredX = globalMax + SPINE_PADDNG - minVal;
                        if (requiredX > minSafeX) {
                            console.log(`[Collision] Shifting ${id} at Level ${lvl}: requires ${requiredX}`);
                            minSafeX = requiredX;
                        }
                    }
                }
                
                node.x = minSafeX;
                lastSpineX = minSafeX;

                // 2.3 Update Global Accumulator
                for (const [lvlStr, maxVal] of Object.entries(contour.right)) {
                    const lvl = parseInt(lvlStr);
                    const relevantSide = (lvl > 0) ? 1 : (lvl < 0) ? -1 : 0;
                    if (relevantSide === 0) continue; 
                    
                    const absRight = node.x + maxVal;
                    const currentGlobal = globalContours[relevantSide][lvl];
                    if (currentGlobal === undefined || absRight > currentGlobal) {
                        globalContours[relevantSide][lvl] = absRight;
                    }
                }
            });

            // 3. Place Tributaries
            mainPathIds.forEach(id => {
                const node = nodes.find(n => n.id === id);
                const dir = (node.spineIndex % 2 === 0) ? 1 : -1;
                if (node.expanded) {
                    placeTributaries(node, dir);
                }
            });

            render();
        }

        // Returns { left: {lvl: min}, right: {lvl: max}, fullWidth: w }
        function calculateContour(node, dir, level = 1) {
            // Base Case
            if (!node.expanded) {
                // Return half-width bounds
                return { left: {}, right: {}, fullWidth: VISUAL_WIDTH }; 
            }
            
            const children = rawEdges.filter(e => e.t === node.id).map(e => e.s).filter(id => !mainPathIds.includes(id));
            if (children.length === 0) {
                 return { left: {}, right: {}, fullWidth: VISUAL_WIDTH };
            }

            // Recursive Step
            const childContours = children.map(cid => calculateContour(nodes.find(n => n.id === cid), dir, level + 1));
            
            // Layout Logic:
            // Calculate total width of children block.
            // If child width > Stride, use child width. Else Stride.
            const spacings = childContours.map(c => Math.max(c.fullWidth, SIBLING_STRIDE));
            const totalW = spacings.reduce((a,b) => a+b, 0);
            
            const mergedLeft = {}; 
            const mergedRight = {};
            
            let currentX = -(totalW / 2);
            
            childContours.forEach((cc, i) => {
                const spacing = spacings[i];
                const childCenterX = currentX + (spacing / 2);
                
                // 1. Add Child's own width at Relative Level 1
                const targetLvl = 1 * dir; 
                updateMinMax(mergedLeft, mergedRight, targetLvl, childCenterX - NODE_HALF_W, childCenterX + NODE_HALF_W);

                // 2. Merge Child's internal contour
                for (const [lvlRelStr, minVal] of Object.entries(cc.left)) {
                    const lvlRel = parseInt(lvlRelStr); 
                    const finalLvl = (1 * dir) + lvlRel; 
                    updateMinMax(mergedLeft, mergedRight, finalLvl, childCenterX + minVal, childCenterX + cc.right[lvlRelStr]);
                }
                
                currentX += spacing;
            });
            
            // Ensure fullWidth is at least MY width
            return { left: mergedLeft, right: mergedRight, fullWidth: Math.max(totalW, VISUAL_WIDTH) };
        }
        
        function updateMinMax(lMap, rMap, lvl, min, max) {
            if (lMap[lvl] === undefined || min < lMap[lvl]) lMap[lvl] = min;
            if (rMap[lvl] === undefined || max > rMap[lvl]) rMap[lvl] = max;
        }

        function placeTributaries(parentNode, dir) {
             const children = rawEdges.filter(e => e.t === parentNode.id).map(e => e.s).filter(id => !mainPathIds.includes(id));
             if (children.length === 0) return;
             
             const childWidths = children.map(cid => {
                  const node = nodes.find(n => n.id === cid);
                  const c = calculateContour(node, dir); 
                  return Math.max(c.fullWidth, SIBLING_STRIDE);
             });
             
             const totalW = childWidths.reduce((a,b) => a+b, 0);
             let startX = parentNode.x - (totalW / 2);
             
             children.forEach((cid, i) => {
                 const childNode = nodes.find(n => n.id === cid);
                 const w = childWidths[i];
                 
                 childNode.x = startX + (w/2);
                 childNode.y = parentNode.y + (dir * V_GAP);
                 childNode.isSpine = false;
                 childNode.placed = true;
                 
                 startX += w;
                 
                 if (childNode.expanded) {
                     placeTributaries(childNode, dir);
                 }
             });
        }
        
        function collectInDegreeNodes(root) {
            let list = [root];
            const children = rawEdges.filter(e => e.t === root.id).map(e => e.s).filter(id => !mainPathIds.includes(id));
            children.forEach(cid => {
                const child = nodes.find(n => n.id === cid);
                if (child.placed) {
                    list = list.concat(collectInDegreeNodes(child));
                }
            });
            return list;
        }

        function render() {
            // Draw Group Hulls for Expanded Central Node
            const centralId = "Optimization";
            const centralNode = nodes.find(n => n.id === centralId);
            
            const hulls = [];
            if (centralNode && centralNode.expanded) {
                const groupNodes = collectInDegreeNodes(centralNode);
                
                // Exclude Spine
                const tributariesOnly = groupNodes.filter(n => n.id !== centralId);
                
                if (tributariesOnly.length > 0) {
                     hulls.push({ nodes: tributariesOnly });
                }
            }

            // Draw Hulls (Convex Hull)
            layerHulls.selectAll(".hull").remove();
            
            hulls.forEach(h => {
                // Collect all corners of all nodes in the group
                const points = [];
                const pad = 15; // Tight padding for precision
                h.nodes.forEach(n => {
                    const w = VISUAL_WIDTH/2 + pad;
                    const h = VISUAL_HEIGHT/2; // No vertical padding needed on corners usually, but safe to add
                    // Use exact corners + padding
                    points.push([n.x - w, n.y - (VISUAL_HEIGHT/2 + pad)]);
                    points.push([n.x + w, n.y - (VISUAL_HEIGHT/2 + pad)]);
                    points.push([n.x + w, n.y + (VISUAL_HEIGHT/2 + pad)]);
                    points.push([n.x - w, n.y + (VISUAL_HEIGHT/2 + pad)]);
                });

                // Compute Convex Hull
                const hullPoints = d3.polygonHull(points);
                
                if (hullPoints) {
                    const line = d3.line()
                        .curve(d3.curveLinearClosed); // Strict straight lines - No Overshoot

                    layerHulls.append("path")
                        .attr("class", "hull")
                        .attr("d", line(hullPoints))
                        .attr("fill", "rgba(76, 175, 80, 0.08)")
                        .attr("stroke", "rgba(76, 175, 80, 0.4)")
                        .attr("stroke-width", 2)
                        .attr("stroke-linejoin", "round") // Rounded corners visual only
                        .attr("stroke-dasharray", "8,4");
                }
            });

            // Links
            const placedNodes = nodes.filter(n => n.placed);
            const finalLinks = rawEdges.map(e => ({
                source: nodes.find(n => n.id === e.s),
                target: nodes.find(n => n.id === e.t),
                isSpine: mainPathIds.includes(e.s) && mainPathIds.includes(e.t)
            })).filter(l => l.source.placed && l.target.placed);

            const linkSel = layerLinks.selectAll(".link").data(finalLinks);
            linkSel.enter().append("path")
                .attr("class", d => d.isSpine ? "link spine-link" : "link tributary-link")
                .merge(linkSel)
                .attr("d", d => {
                     if (d.isSpine) return `M${d.source.x},${d.source.y} L${d.target.x},${d.target.y}`;
                     const dy = d.target.y - d.source.y;
                     return `M${d.source.x},${d.source.y} C${d.source.x},${d.target.y - (dy/2)} ${d.target.x},${d.target.y - (dy/2)} ${d.target.x},${d.target.y}`;
                });
            linkSel.exit().remove();

            // Nodes
            const nodeSel = layerNodes.selectAll(".node").data(placedNodes, d => d.id);
            const nEnter = nodeSel.enter().append("g").attr("class", "node")
                .on("click", (e, d) => { 
                    d.expanded = !d.expanded; 
                    updateLayout(); 
                });
            
            nEnter.append("rect")
                  .attr("width", VISUAL_WIDTH).attr("height", VISUAL_HEIGHT)
                  .attr("x", -(VISUAL_WIDTH/2)).attr("y", -(VISUAL_HEIGHT/2))
                  .attr("rx", 20).attr("ry", 20)
                  .attr("fill", d => d.isSpine ? "#4caf50" : "#2196f3")
                  .attr("stroke", "#fff").attr("stroke-width", 2);
                  
            nEnter.append("text").attr("dy", 5).attr("text-anchor", "middle").text(d => d.id);
            
            nodeSel.merge(nEnter).transition().duration(500).attr("transform", d => `translate(${d.x},${d.y})`);
            nodeSel.exit().remove();
        }
        
        function resetGraph() { nodes.forEach(n => n.expanded = false); updateLayout(); }
        function expandAll() { nodes.forEach(n => n.expanded = true); updateLayout(); }

        updateLayout();
    </script>
</body>
</html>
