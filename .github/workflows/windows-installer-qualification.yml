name: Windows Installer Qualification

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'src-tauri/src/**'
      - 'src-tauri/tauri*.conf.json'
      - 'path_mode/**'
      - 'config/godot-desktop-runtime.json'
      - 'scripts/prepare-desktop-godot-pack.js'
      - 'scripts/verify-desktop-runtime.js'
      - 'scripts/verify-windows-installers.js'
      - 'scripts/*desktop-runtime*.ps1'
      - 'scripts/capture-noteconnection-window.ps1'
      - '.github/workflows/windows-installer-qualification.yml'

permissions:
  contents: read

concurrency:
  group: windows-installer-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installers:
    name: Build ${{ matrix.installer }} installer
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        installer: [nsis, msi]
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      RUSTFLAGS: '-C codegen-units=1'
      PKG_CACHE_PATH: ${{ github.workspace }}/.pkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Isolate temporary files and fetch only Godot runtime assets
        shell: pwsh
        run: |
          $tempRoot = Join-Path $env:GITHUB_WORKSPACE '.installer-temp'
          New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$tempRoot`nTMP=$tempRoot"
          git lfs pull --include="path_mode/assets/**" --exclude=""
          if ($LASTEXITCODE -ne 0) { throw 'Godot runtime asset hydration failed' }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Provision the checksummed Godot engine without publishing a release
        shell: pwsh
        run: |
          $runtime = Get-Content config/godot-desktop-runtime.json -Raw | ConvertFrom-Json
          $archiveRoot = Join-Path $env:GITHUB_WORKSPACE 'output/godot-provision'
          New-Item -ItemType Directory -Path $archiveRoot -Force | Out-Null
          $archive = Join-Path $archiveRoot $runtime.archives.windows.name
          Invoke-WebRequest -Uri ($runtime.upstreamBaseUrl + '/' + $runtime.archives.windows.name) -OutFile $archive
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $runtime.archives.windows.sha256) { throw 'Godot archive digest mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $archiveRoot 'extracted')
          $binary = Join-Path (Join-Path $archiveRoot 'extracted') ([System.IO.Path]::GetFileNameWithoutExtension($runtime.archives.windows.name))
          Copy-Item -LiteralPath $binary -Destination 'src-tauri/bin/godot-x86_64-pc-windows-msvc.exe' -Force
      - run: npm run build:with-vite
      - run: node scripts/build-sidecar.js
      - run: node scripts/prepare-desktop-godot-pack.js
      - name: Build a fresh installer
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --bundles ${{ matrix.installer }} --config src-tauri/tauri.desktop.conf.json
      - name: Record installer build provenance
        run: node -e "require('./scripts/verify-windows-installers').recordInstallerBuild();"
      - name: Archive installer bytes
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-binaries-${{ matrix.installer }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: src-tauri/target/release/bundle/${{ matrix.installer }}/*
      - name: Publish qualification inputs
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-inputs-${{ matrix.installer }}-${{ github.run_id }}
          overwrite: true
          retention-days: 30
          if-no-files-found: error
          # The common ancestor is the repository root; downloads preserve both paths.
          path: |
            output/verification/windows-installer-build.json
            src-tauri/target/release/bundle/${{ matrix.installer }}/*
      - name: Archive Godot build evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-build-evidence-${{ matrix.installer }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            output/desktop/godot-pack.json
            output/desktop/godot-import.log
            output/desktop/godot-export.log
            output/verification/windows-installer-build.json

  qualify-installers:
    name: Qualify ${{ matrix.installer }} installer
    needs: build-installers
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - installer: nsis
            qualify: qualifyNsisArtifact
          - installer: msi
            qualify: qualifyMsiArtifact
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Isolate qualification temporary files
        shell: pwsh
        run: |
          $tempRoot = Join-Path $env:GITHUB_WORKSPACE '.installer-temp'
          New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$tempRoot`nTMP=$tempRoot"
      - name: Download installer and build receipt
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-inputs-${{ matrix.installer }}-${{ github.run_id }}
          path: .
      - name: Install, run and uninstall on an independent runner
        # A step timeout leaves the job alive to upload partial installer logs.
        timeout-minutes: 10
        run: node -e "require('./scripts/verify-windows-installers').${{ matrix.qualify }}().catch(error => { console.error(error); process.exitCode = 1; });"
      - name: Archive execution evidence separately
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-evidence-${{ matrix.installer }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            output/verification/windows-installer-build.json
            output/verification/windows-installers/*/*.json
            output/verification/windows-installers/*/*.log
            output/verification/windows-installers/*/*-runtime/report.json
            output/verification/windows-installers/*/*-runtime/native*.png
            output/verification/windows-installers/*/*-runtime/native*.json
            output/verification/windows-installers/*/*-runtime/native*.log
