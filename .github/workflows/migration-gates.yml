name: Migration Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  migration-gates:
    name: ${{ matrix.suite }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: desktop-migration-suite
            command: npm run test:migration
          - suite: foundation-rollout-boundary-suite
            command: npm run test:foundation:rollout-boundary
          - suite: wasm-parity-strict-suite
            command: npm run test:wasm:parity:gates
          - suite: tauri-rust-suite
            command: npm run test:tauri
          - suite: mobile-pipeline-contract-suite
            command: npm run test:mobile:contracts
          - suite: pathbridge-strict-schema-suite
            command: npm run verify:pathbridge:strict
          - suite: sbom-policy-contract-suite
            command: npm run verify:sbom -- --contract-only
          - suite: sbom-attestation-policy-contract-suite
            command: npm run verify:sbom:attestation -- --contract-only
          - suite: sidecar-signature-policy-contract-suite
            command: npm run verify:sidecar:signatures -- --contract-only
          - suite: license-policy-contract-suite
            command: npm run test:license:contract

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 21
        if: matrix.suite == 'tauri-rust-suite'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust toolchain
        if: matrix.suite == 'tauri-rust-suite'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Write-Host "rustup not found on runner, bootstrapping rustup-init..."
            Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "rustup-init.exe"
            .\rustup-init.exe -y --profile minimal --default-toolchain stable
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path += ";$env:USERPROFILE\.cargo\bin"
          }

          rustup set profile minimal
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Run gate
        run: ${{ matrix.command }}

  route-registry-contract-gates:
    name: route-registry-contract-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run route registry contract tests
        run: npx jest src/routes/registry.contract.test.ts src/notemd.server.integration.test.ts --no-coverage --runInBand

  convergence-contract-gates:
    name: convergence-node-${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:convergence

  agent-workspace-contract-gates:
    name: agent-workspace-contract-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run agent-workspace contract suites
        run: |
          npm run test:agent-workspace:contracts
          npm run test:conversation-turn-cache:durability

  agent-answer-browser-gates:
    name: agent-answer-browser-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:with-vite
      - name: Verify rendered slim and full answers
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-background-networking --no-first-run \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 \
            --window-size=1600,1200 --force-device-scale-factor=1 \
            --user-data-dir="$RUNNER_TEMP/agent-answer-browser" about:blank \
            > "$RUNNER_TEMP/agent-answer-browser.log" 2>&1 &
          browser_pid=$!
          trap 'kill "$browser_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:9223/json/version > /dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:9223/json/version > /dev/null
          node scripts/verify-agent-answer-browser.js --cdp-port 9223
          node scripts/verify-agent-answer-browser.js --cdp-port 9223 --response-mode full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-answer-browser-evidence
          path: |
            output/browser-research/agent-answer-*
            ${{ runner.temp }}/agent-answer-browser.log
