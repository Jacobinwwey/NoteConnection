site_name: NoteConnection Docs
site_description: Diataxis-based bilingual documentation for NoteConnection
site_url: !ENV [MKDOCS_SITE_URL, "https://jacobinwwey.github.io/NoteConnection/"]
repo_url: https://github.com/Jacobinwwey/NoteConnection
repo_name: Jacobinwwey/NoteConnection
docs_dir: docs
site_dir: build/mkdocs-site
strict: false
extra:
  docs_base_path: !ENV [MKDOCS_BASE_PATH, "/NoteConnection/"]
  docs_host: !ENV [MKDOCS_DOCS_HOST, "https://jacobinwwey.github.io/"]

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: cyan

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - English:
      - Diataxis Overview: diataxis/en/overview.md
      - Tutorials:
          - First Run: diataxis/en/tutorials/first-run.md
      - How-To Guides:
          - Build and Export: diataxis/en/how-to/build-and-export.md
          - Publish Docs to GitHub Pages: diataxis/en/how-to/publish-docs-github-pages.md
          - Single Window Runtime: diataxis/en/how-to/single-window-runtime.md
          - Configure app_config.toml: diataxis/en/how-to/configure-app-config.md
          - Godot + NoteMD + Markdown Workflows: diataxis/en/how-to/godot-notemd-markdown-workflows.md
      - Reference:
          - Interfaces and Runtime: diataxis/en/reference/interfaces-and-runtime.md
          - Godot + NoteMD + Markdown Interfaces: diataxis/en/reference/godot-notemd-markdown-interfaces.md
          - Release and Governance: diataxis/en/reference/release-and-governance.md
          - app_config.toml Schema: diataxis/en/reference/app-config-schema.md
      - Explanation:
          - Architecture and Migration: diataxis/en/explanation/architecture-and-migration.md
          - Startup Node Update Acceleration Plan: diataxis/en/explanation/startup-node-update-acceleration-plan.md
          - Knowledge Mastery Evolution Roadmap: diataxis/en/explanation/knowledge-mastery-evolution-roadmap.md
  - 中文:
      - Diataxis 概览: diataxis/zh/overview.md
      - 教程:
          - 首次运行: diataxis/zh/tutorials/first-run.md
      - 操作指南:
          - 构建与导出: diataxis/zh/how-to/build-and-export.md
          - 发布文档到 GitHub Pages: diataxis/zh/how-to/publish-docs-github-pages.md
          - 单窗口运行时: diataxis/zh/how-to/single-window-runtime.md
          - 配置 app_config.toml: diataxis/zh/how-to/configure-app-config.md
          - Godot + NoteMD + Markdown 工作流: diataxis/zh/how-to/godot-notemd-markdown-workflows.md
      - 参考:
          - 接口与运行时: diataxis/zh/reference/interfaces-and-runtime.md
          - Godot + NoteMD + Markdown 接口: diataxis/zh/reference/godot-notemd-markdown-interfaces.md
          - 发布与治理: diataxis/zh/reference/release-and-governance.md
          - app_config.toml 结构: diataxis/zh/reference/app-config-schema.md
      - 解释:
          - 架构与迁移: diataxis/zh/explanation/architecture-and-migration.md
          - 启动节点更新提速方案: diataxis/zh/explanation/startup-node-update-acceleration-plan.md
          - 知识彻底掌握演进路线图: diataxis/zh/explanation/knowledge-mastery-evolution-roadmap.md
